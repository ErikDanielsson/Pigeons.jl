name: CI

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  
  # test using MPICH as MPI backend (default in MPI.jl)
  test-MPICH-jll:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.11'
        os:
          - ubuntu-latest
          # - macos-13
          # - windows-latest
    steps:
      - name: Enable long paths on windows
        if: ${{ startsWith(matrix.os, 'windows') }}
        run: |
          REG ADD "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false  # or true if you want CI to fail when Codecov fails
          file: lcov.info


  # test OpenMPI by requesting it with MPIPreferences
  # adapted from MPI.jl
  test-docker-jl: 
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - Run TreePPL with Docker - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        version:
          - '1.11'
        os:
          - ubuntu-latest
  
      fail-fast: false
    steps:
    - name: Test TreePPL Docker
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        ls -lah 
        echo $PWD
        docker --version
        mkdir $HOME/.pigeons/
        cd $HOME/.pigeons/
        git clone https://github.com/ErikDanielsson/treeppl.git treeppl
        ls -lah $HOME/.pigeons/treeppl/models/lang
        docker run --rm \
          -v $HOME/.pigeons/treeppl/models/lang:/in \
          -v $HOME/.pigeons/treeppl/models/lang:/out \
          docker.io/danielssonerik/treeppl:9d35622 \
          sh -c 'ls -lah /in/; tpplc -m mcmc-lightweight --pigeons --pigeons-explore-steps 2 --cps full --mcmc-lw-gprob 0.1 --drift 1.0 --sampling-period 1 --kernel --align --incremental-printing /in/coin.tppl --output /out/coin.bin' 
  test-OpenMPI-jll:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - OpenMPI_jll - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        version:
          - '1.11'
        os:
          - ubuntu-latest

      fail-fast: false
    env:
      JULIA_MPI_TEST_BINARY: OpenMPI_jll
      JULIA_MPI_TEST_ABI: OpenMPI
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    - uses: julia-actions/setup-julia@v2
      with:
        version: ${{ matrix.version }}
    - uses: julia-actions/cache@v2

    - name: use OpenMPI_jll
      shell: julia --color=yes --project=test {0}
      run: |
        using Pkg
        Pkg.instantiate()
        using MPIPreferences
        MPIPreferences.use_jll_binary("OpenMPI_jll")
        rm("test/Manifest.toml")

    - uses: julia-actions/julia-runtest@v1
  

